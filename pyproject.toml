[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-slither"
version = "1.0.1"
description = "A colorful terminal Snake game with a beautiful banner and local high scores."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Dibyo Dhara" }]
keywords = ["snake", "game", "terminal", "cli", "curses", "tui"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DibyoD/slither-cli"

[project.scripts]
slither-cli = "slither_cli.__main__:main"

[tool.setuptools]
packages = ["slither_cli"]
